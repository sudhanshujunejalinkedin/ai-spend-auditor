name: CI (Lint & Test)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm install

    - name: Run Lint
      # Bhai yahan humne bypass kiya hai taaki Windows wala directory error na aaye
      run: npx next lint --dir app --dir components --dir lib

    - name: Run Tests
      run: npm test